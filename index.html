<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)" />
    <!-- Apply the saved theme before first paint. Keep in sync with src/utils/theme.ts. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('fretomaton-theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            var color = theme === 'dark' ? '#242424' : '#FFFFFF';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
              meta.content = color;
            });
          }
        } catch (e) {}
      })();
    </script>
    <title>Fretomaton - Fretboard Template Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
